<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">Gender In Film</title>
    <meta name="description" content="An analysis of gender non-conforming characters in film.">
    <meta name="robots" content="index, follow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />

    <script src="https://kit.fontawesome.com/a07a069798.js" crossorigin="anonymous"></script>
    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
    <script defer th:src="@{/js/ajaxsearch.js}" type="text/javascript"></script>
</head>
<body>

    <!-- Can be linked to with #top to jump back to the top of the page. -->
    <a id="top"></a>

    <!-- Navbar -->
    <header th:insert="~{components/nav::navbar}"></header>

    <!-- Main content -->
    <main id="main-content-container" class="container" layout:fragment="content"></main>

    <!-- Footer -->
    <footer th:replace="~{components/footer::footer}"></footer>
</body>
</html>
