<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/root.html}"
      lang="en">
<head>
    <title th:text="${tmdbMovie.title}">Movie Details</title>
</head>
<body>
    <section layout:fragment="content">

        <div class="simple-grid" style="grid-template-columns: 1fr 3fr;">
            <!-- Movie Poster -->
            <img th:src="${#strings.isEmpty(tmdbMovie.posterPath)} ? @{/images/no-poster-300.jpg} : @{'https://image.tmdb.org/t/p/w300/' + ${tmdbMovie.posterPath}}"
                 th:alt="|Poster for ${tmdbMovie.title}|"
                 width="300">

            <!-- Movie Metadata -->
            <div>
                <h1 th:with="releaseYear=${#strings.isEmpty(tmdbMovie.releaseDate)} ? '' : | (${#temporals.format(#temporals.createDate(tmdbMovie.releaseDate, 'yyyy-MM-dd'), 'yyyy')})|"
                    th:utext="|<b>${tmdbMovie.title}</b>${releaseYear}|"></h1>

                <div th:if="${ourMovie != null}" style="display: inline;">
                    <!-- Edit movie button -->
                    <a class="btn btn-primary"
                       sec:authorize="hasRole('ROLE_EDITOR')"
                       th:href="@{/movies/{movieId}/update(movieId=${ourMovie.id})}">
                        Edit Movie
                    </a>

                    <!-- Delete movie button -->
                    <form sec:authorize="hasRole('ROLE_EDITOR')"
                          style="display: inline;"
                          th:action="@{/movies/{movieId}(movieId=${ourMovie.id})}"
                          th:method="DELETE"
                          onsubmit="return confirm('Are you sure you want to delete this movie? It will also delete all characters for the movie.');">
                        <button type="submit" class="btn btn-danger">Delete Movie</button>
                    </form>
                </div>

                <p th:text="${tmdbMovie.overview}"></p>

                <!-- Movie test results -->
                <h3 th:text="|Score: ${ourMovie.countPasses()}/${ourMovie.questions.size()}|"></h3>
                <div class="simple-grid" style="grid-template-columns: repeat(2, 1fr);">
                    <div th:each="question : ${ourMovie.questions}">
                        <span th:switch="${question.answer}">
                            <i th:case="${T(com.ewaterman.genderinfilm.common.BooleanAnswer).YES}"
                               class="fa-solid fa-circle-check"
                               style="color: green;"></i>
                            <i th:case="${T(com.ewaterman.genderinfilm.common.BooleanAnswer).NO}"
                               class="fa-solid fa-circle-xmark"
                               style="color: red;"></i>
                            <i th:case="${T(com.ewaterman.genderinfilm.common.BooleanAnswer).UNCLEAR}"
                               class="fa-solid fa-circle-question"
                               style="color: blue;"></i>
                        </span>
                        <span th:utext="|<b>${question.question.getTextForAnswer(question.answer)}</b>|"></span>
                        <span th:if="${not #strings.isEmpty(question.details)}"
                              th:utext="|<i class='fa-regular fa-comment'></i>|">
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${ourMovie != null}">
            <h2>Transgender Characters</h2>

            <a class="btn btn-success"
               sec:authorize="hasRole('ROLE_EDITOR')"
               th:href="@{/movies/{movieId}/characters/create(movieId=${ourMovie.id})}">
                Add Character
            </a>

            <!-- List out the movie characters -->
            <div th:if="${not #lists.isEmpty(ourMovie.movieCharacters)}"
                 class="simple-grid"
                 style="grid-template-columns: repeat(4, 1fr);">

                <div th:each="character : ${ourMovie.movieCharacters}" class="card">
                    <a th:href="@{/movies/{movieId}/characters/{movieCharacterId}(movieId=${ourMovie.id},movieCharacterId=${character.id})}">
                        <img class="card-img-top"
                             th:src="@{/images/no-person-1920.jpg}"
                             th:alt="|Character portrait for ${character.character.name}|">
                        <div class="card-body">
                            <h5 class="card-title" th:utext="|<b>${character.character.name}</b>|"></h5>
                            <p class="card-text" th:utext="|Actor Name|"></p>
                        </div>
                    </a>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(ourMovie.movieCharacters)}">
                <p>
                    We don't have any transgender characters for this movie listed in our system.
                </p>
            </div>
        </div>

        <div th:if="${ourMovie == null}" >
            <p>
                We don't have this movie listed in our system.
                <a sec:authorize="hasRole('ROLE_EDITOR')" th:href="@{/movies/create(tmdbId=${tmdbMovie.id})}">
                    Add it now!
                </a>
            </p>
        </div>
    </section>
</body>
</html>
