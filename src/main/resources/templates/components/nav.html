<div xmlns:sec="http://www.thymeleaf.org" xmlns:th="http://www.thymeleaf.org" th:fragment="navbar">
    <nav id="custom-navbar">
        <div class="navbar navbar-expand-lg container">
            <div class="container-fluid">

                <a class="navbar-brand" th:href="@{/}">Gender In Film</a>

                <!-- Collapse button on mobile -->
                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent"
                        aria-controls="navbarSupportedContent"
                        aria-expanded="false"
                        aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Section that collapses on mobile -->
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                        <li class="nav-item"><a class="nav-link" th:href="@{/about}">About</a></li>

                        <!-- Search bar -->
                        <li id="nav-search-bar" class="nav-item">
                            <form class="d-flex" role="search" th:action="@{/movies/search}" method="GET">
                                <label htmlFor="user-input">
                                    <span class="visually-hidden">Search for a movie</span>
                                </label>
                                <input id="user-input"
                                       class="form-control"
                                       type="search"
                                       placeholder="Search"
                                       aria-label="Search">
                            </form>

                            <!-- Will be filled with movies that match the above search. -->
                            <div id="replaceable-content"></div>
                        </li>
                    </ul>

                    <!-- Log in / out buttons -->
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="btn btn-danger" sec:authorize="isAuthenticated()" th:href="@{/logout}">
                                Logout
                            </a>
                            <a class="btn btn-success" sec:authorize="!isAuthenticated()" th:href="@{/login}">
                                Login
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
</div>
