<!-- List out each of the results of searching for movies -->
<div xmlns:th="http://www.thymeleaf.org" id="movie-search-result-container">
    <!-- Filter down the results to only show X so that we don't overflow the page. -->
    <div class="movie-search-result-entry"
         th:each="entry, iter : ${tmdbMoviesByTmdbId.entrySet()}"
         th:if="${iter.index < 7 }"
         th:with="tmdbId=${entry.key},
                  tmdbMovie=${entry.value},
                  ourMovie=${ourMoviesByTmdbId.get(tmdbId)}">

        <!-- The searchbar is populated from TMDB, and so ourMovie will be null for some of the results. -->
        <a th:href="${ourMovie} == null ? @{/movies/tmdb/{tmdbId}(tmdbId=${tmdbId})} : @{/movies/{movieId}(movieId=${ourMovie.id})}">
            <div th:with="releaseYear=${#strings.isEmpty(tmdbMovie.releaseDate)} ? '' : ${#temporals.format(#temporals.createDate(tmdbMovie.releaseDate, 'yyyy-MM-dd'), 'yyyy')}"
                 class="movie-search-result-content">
                <img th:src="${#strings.isEmpty(tmdbMovie.posterPath)} ? @{/images/no-poster-92.jpg} : @{'https://image.tmdb.org/t/p/w92/' + ${tmdbMovie.posterPath}}"
                     th:alt="|Poster for ${tmdbMovie.title}|"
                     width="50">
                <div class="movie-search-result-text">
                    <h6 th:text="${tmdbMovie.title}"></h6>
                    <p th:text="${releaseYear}"></p>
                </div>
            </div>
        </a>
    </div>
</div>
