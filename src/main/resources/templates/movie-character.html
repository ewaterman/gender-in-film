<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/root.html}"
      lang="en">
<head>
    <title th:text="${movieCharacter.character.name}">Character Details</title>
</head>
<body>
    <main layout:fragment="content">

        <!-- Breadcrumb Navigation -->
        <nav class="breadcrumb-nav" aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a th:href="@{/movies/{movieId}(movieId=${movieCharacter.movie.id})}"
                       th:text="${movieCharacter.movie.name}"></a>
                </li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${movieCharacter.character.name}"></li>
            </ol>
        </nav>

        <section class="subsection simple-grid" style="grid-template-columns: 1fr 3fr;">
            <!-- Character Portrait -->
            <img th:src="@{/images/no-person-300.jpg}"
                 th:alt="|Character portrait for ${movieCharacter.character.name}|"
                 class="rounded"
                 width="300">

            <!-- Movie Metadata -->
            <div>
                <h1 th:text="${movieCharacter.character.name}"></h1>
            </div>
        </section>

        <section class="subsection">
            <div class="card">
                <div class="card-body">
                    <div class="title-row">
                        <h2 th:text="|Character Score: ${movieCharacter.countPasses()}/${movieCharacter.questions.size()}|"></h2>
                        <div class="title-row-buttons">
                            <!-- Edit character button -->
                            <a class="btn btn-primary"
                               sec:authorize="hasRole('ROLE_EDITOR')"
                               th:href="@{/movies/{movieId}/characters/{movieCharacterId}/update(movieId=${movieCharacter.movie.id},movieCharacterId=${movieCharacter.id})}">
                                Edit Character
                            </a>

                            <!-- Delete character button -->
                            <form sec:authorize="hasRole('ROLE_EDITOR')"
                                  style="display: inline;"
                                  th:action="@{/movies/{movieId}/characters/{movieCharacterId}(movieId=${movieCharacter.movie.id},movieCharacterId=${movieCharacter.id})}"
                                  th:method="DELETE"
                                  onsubmit="return confirm('Are you sure you want to delete this character?');">
                                <button type="submit" class="btn btn-danger">Delete Character</button>
                            </form>
                        </div>
                    </div>

                    <hr>

                    <!-- Character questions -->
                    <div class="simple-grid" style="grid-template-columns: repeat(2, 1fr);">
                        <div th:each="question : ${movieCharacter.questions}">
                            <span th:switch="${question.answer}">
                                <i th:case="${T(com.ewaterman.genderinfilm.common.BooleanAnswer).YES}"
                                   class="fa-solid fa-circle-check"
                                   style="color: green;"></i>
                                <i th:case="${T(com.ewaterman.genderinfilm.common.BooleanAnswer).NO}"
                                   class="fa-solid fa-circle-xmark"
                                   style="color: red;"></i>
                                <i th:case="${T(com.ewaterman.genderinfilm.common.BooleanAnswer).UNCLEAR}"
                                   class="fa-solid fa-circle-question"
                                   style="color: blue;"></i>
                            </span>
                            <span th:utext="|<b>${question.question.getTextForAnswer(question.answer)}</b>|"></span>
                            <i th:if="${not #strings.isEmpty(question.details)}"
                               class="fa-regular fa-comment"
                               data-bs-toggle="tooltip"
                               th:title="${question.details}"></i>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
